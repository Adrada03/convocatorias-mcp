# Despliegue del dashboard en GitHub Pages.
#
# PREPARADO PERO NO ACTIVO. Solo se puede lanzar a mano (workflow_dispatch),
# así que no publica nada hasta que se decida activarlo. Para hacerlo:
#
#   1. Descomentar el disparador `push` de abajo.
#   2. En Settings > Pages del repositorio, poner "Source: GitHub Actions".
#   3. Añadir el fichero `dashboard/CNAME` con una sola línea:
#        convocatorias.alvaroadrada.dev
#      y apuntar ese subdominio por CNAME a <usuario>.github.io.
#
# QUEDA UNA DECISIÓN POR TOMAR, y es la de verdad: `dashboard/data.json` está
# en .gitignore, porque se genera desde el índice local. Este workflow publica
# lo que haya en `dashboard/`, así que antes de activarlo hay que elegir de
# dónde sale ese fichero:
#
#   a) Versionarlo: quitarlo del .gitignore y hacer `convocatorias-mcp export`
#      antes de cada commit. Simple, pero mete 1,7 MB en cada cambio.
#   b) Generarlo en CI con una ingesta programada. Son ~90 peticiones al BOE en
#      el primer arranque y unas pocas al día después; habría que respetar el
#      mismo rate limiting y no lanzarlo en cada push.
#   c) Subirlo como artefacto desde la máquina del usuario.
#
# Mientras no se decida, el dashboard se usa en local:
#   convocatorias-mcp export && python -m http.server -d dashboard 8000

name: Dashboard (GitHub Pages)

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - "dashboard/**"
  #     - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; si entra otro, que espere en vez de pisarse.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que hay datos que publicar
        run: |
          if [ ! -f dashboard/data.json ]; then
            echo "Falta dashboard/data.json: el dashboard se publicaria vacio." >&2
            echo "Genéralo con 'convocatorias-mcp export' o decide de dónde sale." >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deployment
        uses: actions/deploy-pages@v4

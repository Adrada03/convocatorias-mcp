# Ingiere el BOE, exporta el JSON y publica el dashboard en GitHub Pages.
#
# El índice no se versiona: se guarda en la caché de Actions entre ejecuciones
# y la ingesta solo pide los días que falten. Si la caché se pierde, rehace la
# ventana de 30 días, que son treinta peticiones a una API de datos abiertos.
#
# El User-Agent identificado y el retardo entre peticiones se mantienen aquí
# igual que en local. No porque el BOE lo exija, sino por cortesía: desde CI es
# igual de fácil ser educado.
#
# El dashboard público usa watchlists.demo.yaml, con intereses inventados, para
# que se vea el ranking funcionando sobre datos reales sin publicar los
# criterios de nadie. Las watchlists de verdad viven en watchlists.yaml, que no
# se versiona.
#
# PENDIENTE DE ACTIVAR: hay que poner "Source: GitHub Actions" en Settings >
# Pages. Hasta entonces el despliegue falla, que es el comportamiento correcto
# para algo que todavía no se ha decidido publicar.

name: Dashboard

on:
  schedule:
    # 07:00 UTC: el BOE publica a primera hora, así que con el cambio de hora
    # esto cae entre las 08:00 y las 09:00 de Madrid.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; si entra otro, que espere en vez de pisarse.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CONVOCATORIAS_INDEX_PATH: ${{ github.workspace }}/.cache/convocatorias-index.sqlite3
  # Watchlists de ejemplo, versionadas. Las reales de cada uno viven en
  # watchlists.yaml, que no se versiona: sus criterios dicen a qué aspira una
  # persona concreta. Con estas, el sitio publicado enseña el ranking y los
  # chips de afinidad funcionando sin publicar el perfil de nadie, y la propia
  # página avisa de que son de ejemplo.
  CONVOCATORIAS_WATCHLISTS_PATH: ${{ github.workspace }}/watchlists.demo.yaml

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar
        run: pip install -e .

      - name: Restaurar el índice
        uses: actions/cache@v4
        with:
          path: .cache
          # La clave lleva el run_id para guardar una entrada nueva cada día;
          # restore-keys recupera la más reciente que haya.
          key: indice-boe-${{ github.run_id }}
          restore-keys: |
            indice-boe-

      - name: Ingerir lo que falte
        # Incremental: las fechas ya resueltas no se vuelven a pedir, así que
        # un día normal son una o dos peticiones. Si la caché se perdió, 30.
        run: convocatorias-mcp ingest --backfill 30

      - name: Exportar el JSON del dashboard
        run: convocatorias-mcp export

      - name: Comprobar que hay algo que publicar
        run: |
          python - <<'PY'
          import json, pathlib, sys
          datos = json.loads(pathlib.Path("dashboard/data.json").read_text(encoding="utf-8"))
          total = len(datos["convocatorias"])
          print(f"{total} convocatorias, datos hasta {datos['cubre_hasta']}")
          if total == 0:
              sys.exit("El export salio vacio: no se publica un dashboard sin datos.")
          PY

      # Para activar el dominio propio, descomentar. El DNS tiene que apuntar
      # convocatorias.alvaroadrada.dev por CNAME a <usuario>.github.io antes,
      # o GitHub rechazará el dominio.
      # - name: Dominio propio
      #   run: cp CNAME.pendiente dashboard/CNAME

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: despliegue
        uses: actions/deploy-pages@v4

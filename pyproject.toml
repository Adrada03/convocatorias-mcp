[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "convocatorias-mcp"
version = "0.1.0"
description = "Servidor MCP que vigila los boletines oficiales españoles y encuentra convocatorias que encajan con tu perfil"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Álvaro Adrada" }]
keywords = ["mcp", "model-context-protocol", "boe", "convocatorias", "becas", "datos-abiertos"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Natural Language :: Spanish",
]
dependencies = [
  "mcp>=1.2",
  "httpx>=0.27",
  "pydantic>=2.7",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.5",
]

[project.scripts]
convocatorias-mcp = "convocatorias_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/Adrada03/convocatorias-mcp"
Repository = "https://github.com/Adrada03/convocatorias-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/convocatorias_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # comprehensions
  "SIM",  # simplify
  "RUF",  # ruff
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["src/convocatorias_mcp"]
branch = true
